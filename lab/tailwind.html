<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Web Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900">

    <!-- Navbar -->
    <nav class="bg-gray-800 p-4">
        <div class="container mx-auto flex justify-between items-center">
            <!-- Logo -->
            <a href="#" class="text-white text-lg font-bold">MySite</a>

            <!-- Mobile Menu Button -->
            <button id="menu-toggle" class="text-white lg:hidden focus:outline-none">
                ☰
            </button>

            <!-- Navigation Links -->
            <ul id="menu" class="hidden lg:flex space-x-6 text-white">
                <li><a href="#" class="hover:text-gray-300">Home</a></li>
                <li><a href="#" class="hover:text-gray-300">About</a></li>
                <li><a href="#" class="hover:text-gray-300">Services</a></li>
                <li><a href="#" class="hover:text-gray-300">Contact</a></li>
            </ul>
        </div>

        <!-- Mobile Menu (Hidden by Default) -->
        <div id="mobile-menu" class="hidden bg-gray-700 p-4">
            <ul class="space-y-2 text-white">
                <li><a href="#" class="block p-2 hover:bg-gray-600">Home</a></li>
                <li><a href="#" class="block p-2 hover:bg-gray-600">About</a></li>
                <li><a href="#" class="block p-2 hover:bg-gray-600">Services</a></li>
                <li><a href="#" class="block p-2 hover:bg-gray-600">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- Hero Section -->
    <div class="flex justify-center items-center h-[50vh] bg-blue-300 text-center text-white text-3xl font-bold sm:bg-red-400">
        Welcome to My Responsive Page
    </div>

    <!-- Two-Column Layout -->
    <div class="container mx-auto p-6 grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="bg-white p-6 rounded-lg shadow-md">Left Section</div>
        <div class="bg-white p-6 rounded-lg shadow-md">Right Section</div>
    </div>

    <!-- JavaScript for Mobile Menu -->
    <script>
        document.getElementById('menu-toggle').addEventListener('click', function() {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        });
    </script>

</body>
</html>
