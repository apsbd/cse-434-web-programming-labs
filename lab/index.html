<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
    </head>
    <body>
        <div id="app">
            <h1>To-Do List</h1>
            <input type="text" id="new-todo" placeholder="Add new to-do" />
            <button id="add-todo">Add</button>
            <ul id="todo-list"></ul>
        </div>

        <script>
            // State Management using Closure
            const todoApp = () => {
                let todos = [];

                // Component: Todo Item
                function createTodoItem(todo, index) {
                    const li = document.createElement('li');
                    li.innerText = todo.text;
                    li.style.textDecoration = todo.completed
                        ? 'line-through'
                        : 'none';

                    // Toggle Completion
                    li.addEventListener('click', () => {
                        todos[index].completed = !todos[index].completed;
                        render();
                    });

                    // Delete Button
                    const deleteButton = document.createElement('button');
                    deleteButton.innerText = 'Delete';
                    deleteButton.addEventListener('click', (e) => {
                        e.stopPropagation(); // Prevent toggle on click
                        todos.splice(index, 1);
                        render();
                    });

                    li.appendChild(deleteButton);
                    return li;
                }

                // Component: Todo List
                function render() {
                    const todoList = document.getElementById('todo-list');
                    todoList.innerHTML = '';

                    todos.forEach((todo, index) => {
                        todoList.appendChild(createTodoItem(todo, index));
                    });
                }

                // Add New Todo
                function addTodo() {
                    const input = document.getElementById('new-todo');
                    const text = input.value.trim();
                    if (text !== '') {
                        todos.push({ text, completed: false });
                        input.value = '';
                        render();
                    }
                }

                // Event Listener for Add Button
                document
                    .getElementById('add-todo')
                    .addEventListener('click', addTodo);
            };

            todoApp();
        </script>
    </body>
</html>
